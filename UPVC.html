<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موتور رندر ماتریکسی UPVC | به‌رچاو</title>
    <meta name="description" content="سیستم طراحی و رندر ماتریکسی درب و پنجره UPVC شرکت به‌رچاو.">
    
    <!-- آیکون‌ها و فونت‌ها -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- کتابخانه‌های خارجی -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- فایل استایل اختصاصی سایت -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- تنظیمات سفارشی رنگ‌ها و فونت هم‌راستا با بقیه صفحات -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#0a192f',
                        'navy-light': '#112240',
                        'teal': '#20b2aa',
                        'teal-light': '#64ffda',
                    },
                    fontFamily: {
                        'vazir': ['Vazirmatn', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- استایل‌های اختصاصی موتور رندر و مخفی‌سازی باکس گزارش در حالت عادی -->
    <style>
        .interactive-svg { transition: all 0.2s ease; }
        .interactive-svg:hover { filter: brightness(0.95); }
        
        /* پنهان‌سازی بخش گزارش و شناسنامه در حالت نمایش صفحه، و ظاهر شدن فقط هنگام چاپ */
        #project-summary-sheet {
            display: none !important;
        }

        /* تنظیمات چاپ A4 Landscape و بهینه‌سازی خروجی */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body { background: white !important; }
            .no-print, .builder-ui, header, footer { display: none !important; }
            .print-card { border: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
            .print-grid { display: grid !important; }
            .svg-wrapper { border: none !important; box-shadow: none !important; }
            
            #project-summary-sheet {
                display: flex !important;
            }
        }
    </style>
</head>
<body class="font-vazir bg-gray-50 text-slate-800">
    
    <!-- هدر یکدست با سایر صفحات سایت - بهینه‌شده برای موبایل -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-3 py-2 flex justify-between items-center gap-2">
            
            <!-- بخش دکمه‌های عملیاتی (سمت راست در حالت RTL) -->
            <div class="flex items-center gap-1.5">
                <button onclick="window.print()" class="bg-teal text-white px-2.5 py-1.5 rounded-lg font-medium text-xs hover:bg-navy transition flex items-center gap-1 cursor-pointer shadow-sm">
                    <i class="fas fa-print text-[11px]"></i> 
                    <span class="hidden sm:inline">چاپ نقشه‌های ساخت</span>
                    <span class="sm:hidden">چاپ</span>
                </button>
                <a href="index.html" class="bg-gray-50 hover:bg-gray-100 text-gray-700 px-2.5 py-1.5 rounded-lg font-medium text-xs transition flex items-center gap-1 border border-gray-200">
                    <i class="fas fa-home text-[11px]"></i> 
                    <span class="hidden sm:inline">بازگشت به صفحه اصلی</span>
                    <span class="sm:hidden">صفحه اصلی</span>
                </a>
            </div>

            <!-- لوگو و عنوان (سمت چپ در حالت RTL) با کادر محافظت‌شده در برابر استایل‌های خارجی -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <div class="text-left">
                    <h1 class="text-sm font-bold text-navy leading-tight">به‌رچاو</h1>
                    <p class="text-[10px] text-gray-500 leading-tight">موتور رندر UPVC</p>
                </div>
                <div style="height: 28px; width: 85px;" class="flex items-center justify-end overflow-hidden">
                    <img src="assets/images/logo.png" alt="بَرچاو" style="height: 100%; width: auto; max-width: none; object-fit: contain;" />
                </div>
            </div>

        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- فرم مشخصات پروژه -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 mb-6 print-card">
            <h2 class="text-lg font-bold text-navy mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                <i class="fas fa-file-signature text-teal"></i> مشخصات پروژه
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1.5">نام کارفرما</label>
                    <input type="text" class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:border-teal focus:ring-1 focus:ring-teal outline-none transition bg-gray-50/50" placeholder="مثال: شرکت سازه گستر">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1.5">شماره تماس کارفرما</label>
                    <input type="text" class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:border-teal focus:ring-1 focus:ring-teal outline-none transition bg-gray-50/50" placeholder="09123456789">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1.5">نام متصدی تکمیل فرم</label>
                    <input type="text" class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:border-teal focus:ring-1 focus:ring-teal outline-none transition bg-gray-50/50" placeholder="نام شما">
                </div>
            </div>
        </div>

        <div class="mb-6">
            <button type="button" onclick="addNewWindow()" class="bg-teal text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg hover:bg-navy transition-all duration-300 flex items-center gap-2 cursor-pointer">
                <i class="fas fa-plus ml-1"></i> افزودن پنجره/درب جدید
            </button>
        </div>
        
        <!-- نگهدارنده اصلی نقشه‌ها و شناسنامه پروژه -->
        <div id="windows-container"></div>
    </main>

    <!-- فوتر هماهنگ با سایر صفحات سایت -->
    <footer class="bg-navy text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-2">© 2026 به‌رچاو. تمامی حقوق محفوظ است.</p>
            <div class="flex justify-center gap-6 text-sm text-gray-400">
                <a href="tel:09188797939" class="hover:text-teal transition">
                    <i class="fas fa-phone ml-1"></i>
                    09188797939
                </a>
                <a href="https://instagram.com/bercaw_marketing" target="_blank" class="hover:text-teal transition">
                    <i class="fab fa-instagram ml-1"></i>
                    @bercaw_marketing
                </a>
            </div>
        </div>
    </footer>

    <!-- اتصال به فایل JS مخصوص UPVC -->
    <script src="assets/js/upvc.js"></script>
</body>
</html>
