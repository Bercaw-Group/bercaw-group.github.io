<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم طراحی ماتریکسی و هوشمند درب و پنجره | به‌رچاو</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'navy': '#0f172a', 'teal': '#0ea5e9' },
                    fontFamily: { 'vazir': ['Vazirmatn', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        @media print {
            body { background-color: #fff !important; }
            header, .no-print { display: none !important; }
            .print-container { max-width: 100% !important; padding: 0 !important; }
            .print-card { border: none !important; box-shadow: none !important; page-break-after: always; }
            .print-grid { display: block !important; }
            .svg-wrapper { min-height: auto !important; border: none !important; }
            #print-header { display: flex !important; border-bottom: 2px solid #0f172a; margin-bottom: 2rem; padding-bottom: 1rem; }
            .builder-ui { display: none !important; }
        }
        .row-container { border: 2px dashed #cbd5e1; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; background: #f8fafc; }
        .col-container { border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.75rem; background: #ffffff; min-width: 220px; flex: 1; }
        select, input { font-size: 0.75rem; }
        .readonly-input { background-color: #e2e8f0; cursor: not-allowed; border-color: #cbd5e1; color: #475569; }
    </style>
</head>
<body class="font-vazir bg-slate-50 pb-20">

    <header class="bg-white shadow sticky top-0 z-50 no-print">
        <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-navy text-white px-3 py-1 rounded font-bold text-lg shadow">به‌رچاو</div>
                <h1 class="text-sm font-bold text-slate-700">موتور رندر ماتریکسی UPVC</h1>
            </div>
            <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-navy px-4 py-2 rounded-lg font-bold transition flex items-center gap-2">
                <i class="fas fa-print"></i> چاپ نقشه‌های ساخت
            </button>
        </nav>
    </header>

    <div id="print-header" class="hidden justify-between items-end px-8 pt-8">
        <div>
            <h2 class="text-3xl font-bold text-navy mb-2">گروه صنعتی به‌رچاو</h2>
            <p class="text-md font-bold text-slate-600">نقشه فنی ساخت، برش متریال و مونتاژ</p>
        </div>
        <div class="text-left text-sm font-medium">
            <p id="print-date"></p>
        </div>
    </div>

    <main class="container mx-auto px-4 py-6 max-w-[1500px] print-container">
        <form id="upvc-form" class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-card">
                <div class="bg-slate-800 text-white px-5 py-3 flex justify-between items-center">
                    <h2 class="font-bold flex items-center gap-2"><i class="fas fa-cogs"></i> پنل طراحی شبکه‌ها و تخصیص مقاطع</h2>
                    <button type="button" onclick="addNewWindow()" class="bg-teal hover:bg-sky-500 text-white px-3 py-1.5 rounded text-sm font-bold transition no-print">
                        + افزودن پنجره/درب جدید
                    </button>
                </div>
                <div class="p-6 space-y-12" id="windows-container">
                    <!-- خروجی ماتریکس JS -->
                </div>
            </div>
        </form>
    </main>
    
    <script src="assets/js/upvc.js"></script>
</body>
</html>
