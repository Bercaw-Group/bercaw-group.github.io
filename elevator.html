<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[عنوان مرتبط با این صفحه] | به‌رچاو</title>
<meta name="description" content="[فرم اولیه اطلاعات مشخصات آسانسور و ابعاد آن در بازدید اولیه]">
<link rel="canonical" href="https://bercaw-group.github.io/elevator.html">

    
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    
    <!-- فونت و استایل‌های اصلی طبق ساختار سایت شما -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- اسکریپت وب‌اپ تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'navy': '#0a192f',
                        'navy-light': '#112240',
                        'teal': '#20b2aa',
                        'teal-light': '#64ffda',
                    },
                    fontFamily: {
                        'vazir': ['Vazirmatn', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-vazir bg-gray-50 pb-20">

    <!-- هدر مشابه صفحات دیگر -->
    <header class="bg-white shadow-lg sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="assets/images/logo.png" alt="بَرچاو" class="h-10 w-auto">
                <div>
                    <h1 class="text-lg font-bold text-navy">به‌رچاو</h1>
                    <p class="text-xs text-gray-600">فرم بازدید اولیه (BER-EV-001)</p>
                </div>
            </div>
            <a href="index.html" class="text-gray-500 hover:text-teal transition" id="close-btn">
                <i class="fas fa-times text-2xl"></i>
            </a>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-3xl">
        
        <form id="elevator-form" class="space-y-6">
            
            <!-- بخش 1: اطلاعات کارفرما و پروژه -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                    <i class="fas fa-user-tie"></i>
                    <h2 class="font-bold">۱. اطلاعات کارفرما و پروژه</h2>
                </div>
                <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">نام کارفرما *</label>
                        <input type="text" name="clientName" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">شماره تماس *</label>
                        <input type="tel" name="phone" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-left" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">نام بازدیدکننده به‌رچاو *</label>
                        <input type="text" name="visitorName" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm text-gray-600 mb-1">آدرس پروژه</label>
                        <textarea name="projectAddress" rows="2" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition"></textarea>
                    </div>
                </div>
            </div>

            <!-- بخش 2: مشخصات ساختمان -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                    <i class="fas fa-building"></i>
                    <h2 class="font-bold">۲. مشخصات ساختمان</h2>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">کاربری ساختمان</label>
                        <div class="flex flex-wrap gap-4">
                            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="buildingType" value="مسکونی"> مسکونی</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="buildingType" value="تجاری"> تجاری</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="buildingType" value="اداری"> اداری</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="buildingType" value="درمانی"> درمانی</label>
                            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="buildingType" value="ویلایی"> ویلایی</label>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">تعداد طبقات</label>
                            <input type="number" name="floors" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">تعداد توقف</label>
                            <input type="number" name="stops" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">ارتفاع تقریبی (متر)</label>
                            <input type="number" name="approxHeight" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition">
                        </div>
                    </div>
                </div>
            </div>

            <!-- بخش 3: ابعاد چاه آسانسور -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                    <i class="fas fa-ruler-combined"></i>
                    <h2 class="font-bold">۳. ابعاد چاه آسانسور (سانتی‌متر)</h2>
                </div>
                <div class="p-6 grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">عرض چاه (W)</label>
                        <input type="number" name="wellWidth" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-center" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">عمق چاه (D)</label>
                        <input type="number" name="wellDepth" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-center" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ارتفاع چاه (H)</label>
                        <input type="number" name="wellHeight" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-center" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">عمق چاهک (Pit)</label>
                        <input type="number" name="pitDepth" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-center" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">ارتفاع اورهد (OH)</label>
                        <input type="number" name="overheadHeight" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition text-center" dir="ltr">
                    </div>
                </div>
            </div>

            <!-- بخش 4 و 5: وضعیت و نوع آسانسور -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- وضعیت اجرا -->
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                        <i class="fas fa-tools"></i>
                        <h2 class="font-bold">۴. وضعیت اجرا</h2>
                    </div>
                    <div class="p-6 space-y-3">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="execStatus" value="چاه آماده است"> چاه آماده است</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="execStatus" value="نیاز به آهن‌کشی"> نیاز به آهن‌کشی</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="execStatus" value="نیاز به برق سه‌فاز"> نیاز به برق سه‌فاز</label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="execStatus" value="نیاز به داربست"> نیاز به داربست</label>
                    </div>
                </div>

                <!-- نوع آسانسور -->
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                        <i class="fas fa-elevator"></i>
                        <h2 class="font-bold">۵. نوع آسانسور</h2>
                    </div>
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-2">سیستم محرکه</label>
                            <div class="flex flex-wrap gap-3">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="elevatorType" value="کششی گیربکس"> گیربکس</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="elevatorType" value="کششی گیرلس"> گیرلس</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="elevatorType" value="هیدرولیک"> هیدرولیک</label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-2">ظرفیت کابین</label>
                            <div class="flex flex-wrap gap-3">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="capacity" value="4 نفره"> ۴ نفره</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="capacity" value="6 نفره"> ۶ نفره</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="capacity" value="8 نفره"> ۸ نفره</label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="capacity" value="13 نفره"> ۱۳ نفره</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- بخش آخر: توضیحات و برآورد -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-navy text-white px-6 py-3 flex items-center gap-2">
                    <i class="fas fa-clipboard-list"></i>
                    <h2 class="font-bold">۶. توضیحات و تجهیزات پیشنهادی</h2>
                </div>
                <div class="p-6">
                    <textarea name="description" rows="4" placeholder="موارد تکمیلی، برندهای پیشنهادی (موتور، تابلو، کابین و...) و برآورد هزینه تقریبی را اینجا بنویسید..." class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-teal outline-none transition"></textarea>
                </div>
            </div>

            <!-- دکمه ثبت -->
            <button type="submit" id="submit-btn" class="w-full bg-teal text-white text-lg font-bold py-4 rounded-xl shadow-lg hover:bg-navy transition flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i>
                ثبت فرم بازدید در سیستم
            </button>

            <!-- پیام موفقیت -->
            <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center mt-4">
                اطلاعات با موفقیت در شیت Elevator ثبت شد!
            </div>

        </form>
    </main>
    
<script src="assets/js/elevator.js"></script>
    
</body>
</html>
